<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleaños Katleen 💛</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f172a;
            --bg-bottom: #1e293b;
            --sunflower-yellow: #FFD700;
            --sunflower-dark: #B8860B;
            --heart-red: #ff4d4d;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            color: white;
        }

        /* --- PANTALLA DE INICIO MEJORADA --- */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #2d1b3a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease;
        }

        .start-content {
            text-align: center;
            animation: pulsar 2s infinite;
        }

        .start-content h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffaa00;
        }

        .start-content .girasol-inicial {
            font-size: 5rem;
            margin: 20px 0;
            animation: girar 10s linear infinite;
        }

        .start-btn {
            padding: 18px 50px;
            font-size: 1.8rem;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Dancing Script', cursive;
            box-shadow: 0 0 30px #FFD700;
            transition: all 0.3s;
            margin-top: 30px;
            font-weight: bold;
        }

        .start-btn:hover { 
            transform: scale(1.1); 
            box-shadow: 0 0 50px #FFD700;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- LUNA --- */
        .luna {
            position: absolute;
            top: 50px;
            right: 5%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fffde7, #ffe484);
            border-radius: 50%;
            box-shadow: 0 0 40px #fffde7, 0 0 80px #ffd700;
            animation: brilloLuna 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes brilloLuna {
            0%, 100% { box-shadow: 0 0 40px #fffde7, 0 0 80px #ffd700; }
            50% { box-shadow: 0 0 60px #fffde7, 0 0 120px #ffd700; }
        }

        /* --- NUBES --- */
        .nube {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            filter: blur(10px);
            animation: flotarNube 30s linear infinite;
            z-index: 0;
        }

        .nube1 { top: 10%; left: -200px; width: 300px; height: 80px; }
        .nube2 { top: 25%; right: -200px; width: 400px; height: 100px; animation-direction: reverse; }

        @keyframes flotarNube {
            from { transform: translateX(-200px); }
            to { transform: translateX(110vw); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding-top: 8vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- TEXTO --- */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff0000;
            margin: 0;
            opacity: 0;
            transform: translateY(20px);
            animation: aparecerTexto 1.5s forwards 1s;
        }

        p {
            font-size: 1.5rem;
            color: #ffd700;
            margin-top: 10px;
            opacity: 0;
            animation: aparecerTexto 1.5s forwards 2s;
        }

        @keyframes aparecerTexto {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MARCO PARA LA IMAGEN (key.jpg) --- */
        .marco-imagen {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 5px solid #FFD700;
            box-shadow: 0 0 50px #FFD700, 0 0 100px #ffaa00;
            margin: 30px auto;
            overflow: hidden;
            animation: flotarMarco 3s ease-in-out infinite;
            background: linear-gradient(45deg, #2e7d32, #4caf50);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            animation: aparecerImagen 1.5s forwards 2.5s, flotarMarco 3s ease-in-out infinite 4s;
        }

        .marco-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .marco-imagen img:hover {
            transform: scale(1.1);
        }

        .marco-imagen .placeholder {
            color: white;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        @keyframes aparecerImagen {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes flotarMarco {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- JARDÍN CON FLORES INTERCALADAS --- */
        .garden {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40vh;
            z-index: 5;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Estilos base para todas las flores */
        .sunflower, .margarita {
            position: relative;
            width: 100px;
            height: 250px;
            transform-origin: bottom center;
            animation: crecer 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        /* Tallo (compartido) */
        .tallo {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 0;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            border-radius: 5px;
            animation: crecerTallo 1.2s ease-out forwards;
            box-shadow: 0 0 10px #4caf50;
        }

        /* Hojas (compartidas) */
        .hoja {
            position: absolute;
            width: 30px; height: 15px;
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border-radius: 0 50% 0 50%;
            transform-origin: left center;
            box-shadow: 0 0 10px #4caf50;
        }
        .hoja-izq { top: 100px; left: -10px; transform: rotate(-45deg); }
        .hoja-der { top: 140px; right: -10px; transform: rotate(225deg); }

        /* --- GIRASOL (amarillo/dorado) --- */
        .flor-girasol {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: conic-gradient(
                #FFD700 0deg 20deg, #B8860B 20deg 40deg,
                #FFD700 40deg 60deg, #B8860B 60deg 80deg,
                #FFD700 80deg 100deg, #B8860B 100deg 120deg,
                #FFD700 120deg 140deg, #B8860B 140deg 160deg,
                #FFD700 160deg 180deg, #B8860B 180deg 200deg,
                #FFD700 200deg 220deg, #B8860B 220deg 240deg,
                #FFD700 240deg 260deg, #B8860B 260deg 280deg,
                #FFD700 280deg 300deg, #B8860B 300deg 320deg,
                #FFD700 320deg 340deg, #B8860B 340deg 360deg
            );
            box-shadow: 0 0 20px #FFD700;
            animation: aparecerFlor 1s forwards 0.5s;
        }

        .centro-girasol {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 35px; height: 35px;
            background: radial-gradient(circle, #8B4513, #5d2e0c);
            border-radius: 50%;
            z-index: 2;
            box-shadow: inset -3px -3px 5px #3e1e06;
        }

        /* --- MARGARITA (blanca) --- */
        .flor-margarita {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(
                #ffffff 0deg 30deg, #f0f0f0 30deg 60deg,
                #ffffff 60deg 90deg, #f0f0f0 90deg 120deg,
                #ffffff 120deg 150deg, #f0f0f0 150deg 180deg,
                #ffffff 180deg 210deg, #f0f0f0 210deg 240deg,
                #ffffff 240deg 270deg, #f0f0f0 270deg 300deg,
                #ffffff 300deg 330deg, #f0f0f0 330deg 360deg
            );
            box-shadow: 0 0 20px #ffffff;
            animation: aparecerFlor 1s forwards 0.5s;
        }

        .centro-margarita {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 25px; height: 25px;
            background: radial-gradient(circle, #FFD700, #B8860B);
            border-radius: 50%;
            z-index: 2;
        }

        /* --- ANIMACIONES --- */
        @keyframes crecer { 
            from { transform: scale(0) translateY(50px); opacity: 0; } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        @keyframes crecerTallo { 
            from { height: 0; } 
            to { height: 160px; } 
        }
        
        @keyframes aparecerFlor { 
            to { transform: translateX(-50%) scale(1); } 
        }

        /* --- EFECTOS FLOTANTES --- */
        .corazon {
            position: absolute;
            color: var(--heart-red);
            font-size: 24px;
            animation: flotarCorazon 4s ease-in infinite;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        @keyframes flotarCorazon {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .estrella {
            position: absolute;
            color: white;
            font-size: 12px;
            animation: parpadear 2s infinite;
        }
        
        @keyframes parpadear { 
            0%, 100% { opacity: 0.3; } 
            50% { opacity: 1; } 
        }

        /* --- PASTO MEJORADO --- */
        .pasto {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40px;
            background: linear-gradient(to top, #1b5e20, #4caf50);
            z-index: 6;
            border-top: 3px solid #FFD700;
            box-shadow: 0 -5px 20px #4caf50;
        }

        .pasto::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            font-size: 20px;
            color: #4caf50;
            text-shadow: 0 0 10px #4caf50;
            animation: mecerPasto 3s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes mecerPasto {
            0%, 100% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .sunflower, .margarita { transform: scale(0.6); }
            .garden { height: 30vh; }
            .marco-imagen { width: 180px; height: 180px; }
        }

        @media (max-width: 480px) {
    .garden {
        gap: 5px;  /* Menos espacio entre flores */
        padding-bottom: 10px;
    }
    .sunflower, .margarita {
        width: 70px;  /* Más pequeño aún */
        height: 180px;
    }
    h1 {
        font-size: 2rem;
        padding: 0 10px;
    }
    p {
        font-size: 1.2rem;
        padding: 0 15px;
    }
    .marco-imagen {
        width: 150px;
        height: 150px;
        margin: 15px auto;
    }
}
    </style>
</head>
<body>

    <!-- Pantalla de inicio mejorada -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h2>🎁 Un regalo especial para ti</h2>
            <div class="girasol-inicial">🌻✨🌼✨🌻</div>
            <button class="start-btn" onclick="iniciarFiesta()">Abrir Regalo</button>
            <p style="color: #aaa; margin-top: 20px;">Haz clic para comenzar la magia ✨</p>
        </div>
    </div>

    <!-- LUNA -->
    <div class="luna"></div>
    
    <!-- NUBES -->
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <h1>¡Feliz Cumpleaños Katleen! 🎉</h1>
        <p>Que este día esté lleno de luz y alegría como las flores 🌻🌼</p>
        
        <!-- MARCO PARA LA IMAGEN key.jpg -->
        <div class="marco-imagen" id="marcoImagen">
            <!-- IMPORTANTE: Coloca tu archivo key.jpg en la misma carpeta -->
            <img src="key.jpg" alt="Katleen" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="placeholder" style="display: none; width: 100%; height: 100%; background: linear-gradient(45deg, #FFD700, #FFA500); color: white; align-items: center; justify-content: center;">
                ✨ key.jpg ✨<br>Coloca aquí tu foto
            </div>
        </div>
    </div>
    
    <!-- JARDÍN CON FLORES INTERCALADAS (10 en total: 5 girasoles + 5 margaritas intercaladas) -->
    <div class="garden">
        <!-- FLOR 1: Margarita (blanca) -->
        <div class="margarita" style="animation-delay: 0.2s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 2: Girasol (amarillo) -->
        <div class="sunflower" style="animation-delay: 0.4s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 3: Margarita (blanca) -->
        <div class="margarita" style="animation-delay: 0.6s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 4: Girasol (amarillo) -->
        <div class="sunflower" style="animation-delay: 0.8s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 5: Margarita (blanca) -->
        <div class="margarita" style="animation-delay: 1.0s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 6: Girasol (amarillo) -->
        <div class="sunflower" style="animation-delay: 1.2s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 7: Margarita (blanca) -->
        <div class="margarita" style="animation-delay: 1.4s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 8: Girasol (amarillo) -->
        <div class="sunflower" style="animation-delay: 1.6s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 9: Margarita (blanca) -->
        <div class="margarita" style="animation-delay: 1.8s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 10: Girasol (amarillo) -->
        <div class="sunflower" style="animation-delay: 2.0s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
    </div>
    
    <!-- PASTO -->
    <div class="pasto"></div>

    <script>
        // Función para iniciar la fiesta
        function iniciarFiesta() {
            const overlay = document.getElementById('startOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                // Iniciar lluvia de corazones al abrir (más frecuente)
                setInterval(crearCorazon, 250);
                // Crear estrellas iniciales
                crearEstrellas();
                // Crear algunos corazones adicionales al inicio
                for (let i = 0; i < 20; i++) {
                    setTimeout(crearCorazon, i * 150);
                }
            }, 1500);
        }

        // Crear corazones flotantes
        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.className = 'corazon';
            corazon.innerHTML = '❤️';
            
            // Posición aleatoria
            corazon.style.left = Math.random() * 100 + 'vw';
            
            // Tamaño aleatorio (más variado)
            const size = Math.random() * 25 + 15;
            corazon.style.fontSize = size + 'px';
            
            // Duración aleatoria
            corazon.style.animationDuration = (Math.random() * 3 + 3) + 's';
            
            // Retraso aleatorio
            corazon.style.animationDelay = (Math.random() * 2) + 's';
            
            document.body.appendChild(corazon);
            
            // Eliminar después de la animación
            setTimeout(() => {
                corazon.remove();
            }, 6000);
        }

        // Crear estrellas en el fondo
        function crearEstrellas() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const estrella = document.createElement('div');
                    estrella.className = 'estrella';
                    estrella.innerHTML = '✨';
                    estrella.style.top = Math.random() * 70 + '%';
                    estrella.style.left = Math.random() * 100 + '%';
                    estrella.style.animationDelay = Math.random() * 3 + 's';
                    estrella.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    document.body.appendChild(estrella);
                }, i * 50);
            }
        }

        // Precargar la imagen (opcional)
        window.addEventListener('load', function() {
            // Verificar si la imagen existe
            const img = new Image();
            img.src = 'key.jpg';
            img.onload = function() {
                console.log('✅ Imagen key.jpg cargada correctamente');
                document.querySelector('.placeholder').style.display = 'none';
            };
            img.onerror = function() {
                console.log('⚠️ No se encontró key.jpg, mostrando placeholder');
                document.querySelector('.marco-imagen img').style.display = 'none';
                document.querySelector('.placeholder').style.display = 'flex';
            };
        });
    </script>
</body>
</html>
