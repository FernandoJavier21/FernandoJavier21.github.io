<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Feliz Cumpleaños Katleen ❤️</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #0f172a;
            --bg-bottom: #1e293b;
            --sunflower-yellow: #FFD700;
            --sunflower-dark: #B8860B;
            --heart-red: #ff4d4d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            position: relative;
            color: white;
        }

        /* --- PANTALLA DE INICIO MEJORADA PARA MÓVIL --- */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #2d1b3a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1.5s ease;
            padding: 20px;
        }

        .start-content {
            text-align: center;
            animation: pulsar 2s infinite;
            max-width: 100%;
        }

        .start-content h2 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2rem, 8vw, 3rem);
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ffaa00;
            word-wrap: break-word;
        }

        .start-content .girasol-inicial {
            font-size: clamp(3rem, 12vw, 5rem);
            margin: 15px 0;
            animation: girar 10s linear infinite;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: clamp(1.5rem, 6vw, 1.8rem);
            background: linear-gradient(45deg, #FFD700, #FFA500);
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Dancing Script', cursive;
            box-shadow: 0 0 30px #FFD700;
            transition: all 0.3s;
            margin-top: 20px;
            font-weight: bold;
            width: auto;
            min-width: 200px;
            max-width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .start-btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 50px #FFD700;
        }

        .start-content p {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            margin-top: 15px;
            color: #aaa;
        }

        @keyframes pulsar {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- LUNA RESPONSIVA --- */
        .luna {
            position: absolute;
            top: max(20px, 5vh);
            right: 5%;
            width: clamp(50px, 10vw, 80px);
            height: clamp(50px, 10vw, 80px);
            background: radial-gradient(circle at 30% 30%, #fffde7, #ffe484);
            border-radius: 50%;
            box-shadow: 0 0 40px #fffde7, 0 0 80px #ffd700;
            animation: brilloLuna 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes brilloLuna {
            0%, 100% { box-shadow: 0 0 clamp(20px, 4vw, 40px) #fffde7, 0 0 clamp(40px, 8vw, 80px) #ffd700; }
            50% { box-shadow: 0 0 clamp(30px, 6vw, 60px) #fffde7, 0 0 clamp(60px, 12vw, 120px) #ffd700; }
        }

        /* --- NUBES RESPONSIVAS --- */
        .nube {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            filter: blur(10px);
            animation: flotarNube 30s linear infinite;
            z-index: 0;
        }

        .nube1 { 
            top: 10%; 
            left: -200px; 
            width: min(300px, 80vw); 
            height: min(80px, 10vw); 
        }
        
        .nube2 { 
            top: 25%; 
            right: -200px; 
            width: min(400px, 90vw); 
            height: min(100px, 12vw); 
            animation-direction: reverse; 
        }

        @keyframes flotarNube {
            from { transform: translateX(-200px); }
            to { transform: translateX(110vw); }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: max(5vh, 20px) 15px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 50vh;
        }

        /* --- TEXTO RESPONSIVO --- */
        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.2rem, 8vw, 4rem);
            color: #fff;
            text-shadow: 0 0 10px #ff6b6b, 0 0 20px #ff0000;
            margin: 0 0 10px;
            opacity: 0;
            transform: translateY(20px);
            animation: aparecerTexto 1.5s forwards 1s;
            line-height: 1.2;
            padding: 0 10px;
            word-wrap: break-word;
        }

        p {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            color: #ffd700;
            margin: 5px 0 15px;
            opacity: 0;
            animation: aparecerTexto 1.5s forwards 2s;
            padding: 0 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        @keyframes aparecerTexto {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MARCO PARA LA IMAGEN MEJORADO PARA MÓVIL --- */
        .marco-imagen {
            width: clamp(180px, 50vw, 250px);
            height: clamp(180px, 50vw, 250px);
            border-radius: 50%;
            border: clamp(3px, 1vw, 5px) solid #FFD700;
            box-shadow: 0 0 clamp(30px, 5vw, 50px) #FFD700, 0 0 clamp(50px, 8vw, 100px) #ffaa00;
            margin: 10px auto 20px;
            overflow: hidden;
            animation: flotarMarco 3s ease-in-out infinite;
            background: linear-gradient(45deg, #2e7d32, #4caf50);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0);
            animation: aparecerImagen 1.5s forwards 2.5s, flotarMarco 3s ease-in-out infinite 4s;
        }

        .marco-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .marco-imagen .placeholder {
            color: white;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            text-align: center;
            padding: 15px;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        @keyframes aparecerImagen {
            from { opacity: 0; transform: scale(0); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes flotarMarco {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(clamp(-8px, -2vh, -15px)); }
        }

        /* --- JARDÍN RESPONSIVO CON GRID --- */
        .garden {
            position: relative;
            bottom: 0;
            width: 100%;
            min-height: 25vh;
            z-index: 5;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(5px, 2vw, 10px);
            align-items: flex-end;
            padding: 0 clamp(5px, 2vw, 10px) clamp(10px, 3vh, 20px);
            margin-top: auto;
        }

        /* Estilos base para todas las flores */
        .sunflower, .margarita {
            position: relative;
            width: 100%;
            aspect-ratio: 0.4;
            max-width: clamp(60px, 15vw, 100px);
            margin: 0 auto;
            transform-origin: bottom center;
            animation: crecer 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        /* Tallo responsive */
        .tallo {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: clamp(5px, 1.5vw, 10px);
            height: 0;
            background: linear-gradient(90deg, #2e7d32, #4caf50);
            border-radius: 5px;
            animation: crecerTallo 1.2s ease-out forwards;
            box-shadow: 0 0 clamp(5px, 1vw, 10px) #4caf50;
        }

        /* Hojas responsivas */
        .hoja {
            position: absolute;
            width: clamp(15px, 4vw, 30px);
            height: clamp(8px, 2vw, 15px);
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            border-radius: 0 50% 0 50%;
            transform-origin: left center;
            box-shadow: 0 0 clamp(5px, 1vw, 10px) #4caf50;
        }
        
        .hoja-izq { 
            top: min(60px, 30%); 
            left: clamp(-15px, -3vw, -10px); 
            transform: rotate(-45deg); 
        }
        
        .hoja-der { 
            top: min(80px, 40%); 
            right: clamp(-15px, -3vw, -10px); 
            transform: rotate(225deg); 
        }

        /* Flor responsive */
        .flor-girasol, .flor-margarita {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: min(100%, 90px);
            aspect-ratio: 1;
            border-radius: 50%;
            animation: aparecerFlor 1s forwards 0.5s;
        }

        .flor-girasol {
            background: conic-gradient(
                #FFD700 0deg 20deg, #B8860B 20deg 40deg,
                #FFD700 40deg 60deg, #B8860B 60deg 80deg,
                #FFD700 80deg 100deg, #B8860B 100deg 120deg,
                #FFD700 120deg 140deg, #B8860B 140deg 160deg,
                #FFD700 160deg 180deg, #B8860B 180deg 200deg,
                #FFD700 200deg 220deg, #B8860B 220deg 240deg,
                #FFD700 240deg 260deg, #B8860B 260deg 280deg,
                #FFD700 280deg 300deg, #B8860B 300deg 320deg,
                #FFD700 320deg 340deg, #B8860B 340deg 360deg
            );
            box-shadow: 0 0 clamp(10px, 2vw, 20px) #FFD700;
        }

        .flor-margarita {
            background: conic-gradient(
                #ffffff 0deg 30deg, #f0f0f0 30deg 60deg,
                #ffffff 60deg 90deg, #f0f0f0 90deg 120deg,
                #ffffff 120deg 150deg, #f0f0f0 150deg 180deg,
                #ffffff 180deg 210deg, #f0f0f0 210deg 240deg,
                #ffffff 240deg 270deg, #f0f0f0 270deg 300deg,
                #ffffff 300deg 330deg, #f0f0f0 330deg 360deg
            );
            box-shadow: 0 0 clamp(10px, 2vw, 20px) #ffffff;
        }

        .centro-girasol, .centro-margarita {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            aspect-ratio: 1;
            border-radius: 50%;
            z-index: 2;
        }

        .centro-girasol {
            background: radial-gradient(circle, #8B4513, #5d2e0c);
            box-shadow: inset -3px -3px 5px #3e1e06;
        }

        .centro-margarita {
            background: radial-gradient(circle, #FFD700, #B8860B);
        }

        /* --- ANIMACIONES --- */
        @keyframes crecer { 
            from { transform: scale(0) translateY(20px); opacity: 0; } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        @keyframes crecerTallo { 
            from { height: 0; } 
            to { height: clamp(100px, 25vh, 160px); } 
        }
        
        @keyframes aparecerFlor { 
            to { transform: translateX(-50%) scale(1); } 
        }

        /* --- CORAZONES RESPONSIVOS --- */
        .corazon {
            position: absolute;
            color: var(--heart-red);
            font-size: clamp(15px, 4vw, 24px);
            animation: flotarCorazon 4s ease-in infinite;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        @keyframes flotarCorazon {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .estrella {
            position: absolute;
            color: white;
            font-size: clamp(8px, 2.5vw, 12px);
            animation: parpadear 2s infinite;
        }
        
        @keyframes parpadear { 
            0%, 100% { opacity: 0.3; } 
            50% { opacity: 1; } 
        }

        /* --- PASTO RESPONSIVO --- */
        .pasto {
            position: relative;
            bottom: 0;
            width: 100%;
            height: clamp(25px, 5vh, 40px);
            background: linear-gradient(to top, #1b5e20, #4caf50);
            z-index: 6;
            border-top: clamp(2px, 0.5vw, 3px) solid #FFD700;
            box-shadow: 0 -5px 20px #4caf50;
            margin-top: -2px;
        }

        /* Media queries específicos para móviles */
        @media (max-width: 480px) {
            .garden {
                grid-template-columns: repeat(5, 1fr);
                gap: 3px;
                padding: 0 3px;
            }
            
            .sunflower, .margarita {
                max-width: 55px;
            }
            
            .hoja-izq { left: -10px; }
            .hoja-der { right: -10px; }
            
            @keyframes crecerTallo { 
                to { height: 100px; } 
            }
            
            .container {
                padding-top: 15px;
            }
            
            .start-btn {
                min-width: 180px;
                padding: 12px 30px;
            }
        }

        @media (max-width: 360px) {
            .garden {
                grid-template-columns: repeat(5, 1fr);
                gap: 2px;
            }
            
            .sunflower, .margarita {
                max-width: 45px;
            }
            
            @keyframes crecerTallo { 
                to { height: 80px; } 
            }
            
            .hoja-izq { left: -8px; }
            .hoja-der { right: -8px; }
        }

        /* Ajuste para pantallas muy pequeñas */
        @media (max-width: 320px) {
            .sunflower, .margarita {
                max-width: 40px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .marco-imagen {
                width: 150px;
                height: 150px;
            }
        }

        /* Orientación landscape */
        @media (orientation: landscape) and (max-height: 600px) {
            .garden {
                min-height: 30vh;
            }
            
            .container {
                min-height: 40vh;
            }
            
            .marco-imagen {
                width: 150px;
                height: 150px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Pantalla de inicio mejorada -->
    <div class="start-overlay" id="startOverlay">
        <div class="start-content">
            <h2>🎁 Un regalo especial para ti</h2>
            <div class="girasol-inicial">🌻✨🌼✨🌻</div>
            <button class="start-btn" onclick="iniciarFiesta()">Abrir Regalo</button>
            <p>Haz clic para comenzar la magia ✨</p>
        </div>
    </div>

    <!-- LUNA -->
    <div class="luna"></div>
    
    <!-- NUBES -->
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    
    <!-- CONTENIDO PRINCIPAL -->
    <div class="container">
        <h1>¡Feliz Cumpleaños Katleen! 🎉</h1>
        <p>Que este día esté lleno de luz y alegría como las flores 🌻🌼</p>
        
        <!-- MARCO PARA LA IMAGEN key.jpg -->
        <div class="marco-imagen" id="marcoImagen">
            <img src="key.jpg" alt="Katleen" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="placeholder" style="display: none;">✨ key.jpg ✨<br>Coloca aquí tu foto</div>
        </div>
    </div>
    
    <!-- JARDÍN CON FLORES INTERCALADAS -->
    <div class="garden">
        <!-- FLOR 1: Margarita -->
        <div class="margarita" style="animation-delay: 0.2s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 2: Girasol -->
        <div class="sunflower" style="animation-delay: 0.4s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 3: Margarita -->
        <div class="margarita" style="animation-delay: 0.6s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 4: Girasol -->
        <div class="sunflower" style="animation-delay: 0.8s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 5: Margarita -->
        <div class="margarita" style="animation-delay: 1.0s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 6: Girasol -->
        <div class="sunflower" style="animation-delay: 1.2s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 7: Margarita -->
        <div class="margarita" style="animation-delay: 1.4s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 8: Girasol -->
        <div class="sunflower" style="animation-delay: 1.6s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
        
        <!-- FLOR 9: Margarita -->
        <div class="margarita" style="animation-delay: 1.8s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-margarita"><div class="centro-margarita"></div></div>
        </div>
        
        <!-- FLOR 10: Girasol -->
        <div class="sunflower" style="animation-delay: 2.0s;">
            <div class="tallo"><div class="hoja hoja-izq"></div><div class="hoja hoja-der"></div></div>
            <div class="flor-girasol"><div class="centro-girasol"></div></div>
        </div>
    </div>
    
    <!-- PASTO -->
    <div class="pasto"></div>

    <script>
        function iniciarFiesta() {
            const overlay = document.getElementById('startOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                // Reducir frecuencia de corazones en móvil para mejor rendimiento
                const esMovil = window.innerWidth <= 768;
                setInterval(crearCorazon, esMovil ? 400 : 250);
                crearEstrellas();
                for (let i = 0; i < (esMovil ? 10 : 20); i++) {
                    setTimeout(crearCorazon, i * 150);
                }
            }, 1500);
        }

        function crearCorazon() {
            const corazon = document.createElement('div');
            corazon.className = 'corazon';
            corazon.innerHTML = '❤️';
            
            corazon.style.left = Math.random() * 100 + 'vw';
            
            const size = Math.random() * (window.innerWidth <= 480 ? 20 : 25) + (window.innerWidth <= 480 ? 10 : 15);
            corazon.style.fontSize = size + 'px';
            
            corazon.style.animationDuration = (Math.random() * 3 + 3) + 's';
            corazon.style.animationDelay = (Math.random() * 2) + 's';
            
            document.body.appendChild(corazon);
            
            setTimeout(() => {
                corazon.remove();
            }, 6000);
        }

        function crearEstrellas() {
            const cantidad = window.innerWidth <= 480 ? 30 : 60;
            for (let i = 0; i < cantidad; i++) {
                setTimeout(() => {
                    const estrella = document.createElement('div');
                    estrella.className = 'estrella';
                    estrella.innerHTML = '✨';
                    estrella.style.top = Math.random() * 70 + '%';
                    estrella.style.left = Math.random() * 100 + '%';
                    estrella.style.animationDelay = Math.random() * 3 + 's';
                    estrella.style.fontSize = (Math.random() * (window.innerWidth <= 480 ? 12 : 15) + (window.innerWidth <= 480 ? 8 : 10)) + 'px';
                    document.body.appendChild(estrella);
                }, i * 50);
            }
        }

        window.addEventListener('load', function() {
            const img = new Image();
            img.src = 'key.jpg';
            img.onload = function() {
                console.log('✅ Imagen key.jpg cargada correctamente');
                document.querySelector('.placeholder').style.display = 'none';
            };
            img.onerror = function() {
                console.log('⚠️ No se encontró key.jpg, mostrando placeholder');
                document.querySelector('.marco-imagen img').style.display = 'none';
                document.querySelector('.placeholder').style.display = 'flex';
            };
        });

        // Detectar cambios de orientación
        window.addEventListener('resize', function() {
            // Ajustar animaciones si es necesario
            document.body.style.height = window.innerHeight + 'px';
        });
    </script>
</body>
</html>
